# Separate Worker that sends reminder emails on a schedule (Pages can't run cron triggers).
name = "docchase-cron"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Hourly. The code only sends inside each region's business-hours window.
crons = ["0 * * * *"]

[vars]
APP_URL = "https://docchase.pages.dev"
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "DocChase <hello@example.com>"
DAILY_EMAIL_CAP = "90"

# Secrets (run from the cron folder or pass --config cron/wrangler.toml):
#   npx wrangler secret put DATABASE_URL --config cron/wrangler.toml
#   LINK_SECRET (must match the Pages project), RESEND_API_KEY, and AWS_* if you use SES
